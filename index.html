<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryVerse 3D | Cartoon Storytelling for Kids</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hud">
      <h1>StoryVerse 3D</h1>
      <p class="subtitle">Immersive Pixar-like cartoon storytelling with three.js</p>
      <div class="story-controls" id="story-controls"></div>
      <p class="story-description" id="story-description"></p>
      <p class="hint">Press 1-5 to switch stories • Drag to orbit • Scroll to zoom</p>
    </header>
    <canvas id="story-canvas"></canvas>
    <script type="module" src="main.js"></script>
  </body>
</html>
